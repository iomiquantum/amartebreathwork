<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · AMARTE</title>
  <meta name="theme-color" content="#050505" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#050505;color:#F5F2EA;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:2rem;text-align:center;position:relative;overflow:hidden}
    .glow{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,200,150,.18),transparent 60%);pointer-events:none}
    .num{font-family:"Inter Tight",sans-serif;font-weight:700;font-size:7rem;line-height:1;letter-spacing:-.05em;background:linear-gradient(135deg,#00C896,#D4AF37);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
    h1{font-family:"Inter Tight",sans-serif;font-weight:600;letter-spacing:-.03em;font-size:1.6rem;margin:1rem 0 .5rem}
    p{color:rgba(245,242,234,.7);max-width:34rem;margin:0 auto 2rem;line-height:1.6}
    a.cta{display:inline-flex;align-items:center;gap:.5rem;height:3.25rem;padding:0 1.6rem;background:#00C896;color:#0B0F0D;border-radius:9999px;text-decoration:none;font-weight:500;box-shadow:0 0 0 1px rgba(0,200,150,.25),0 10px 40px -10px rgba(0,200,150,.45);transition:all .3s}
    a.cta:hover{background:#10E0A8;transform:scale(1.02)}
    .ring{width:60px;height:60px;border-radius:50%;border:1px solid rgba(0,200,150,.4);margin:0 auto 1rem;display:grid;place-items:center;background:rgba(15,61,52,.4)}
    .dot{width:14px;height:14px;border-radius:50%;background:#00C896;box-shadow:0 0 16px #00C896;animation:p 3s ease-in-out infinite}
    @keyframes p{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.2);opacity:1}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="glow"></div>
    <div>
      <div class="ring"><span class="dot"></span></div>
      <p class="num">404</p>
      <h1>Esta página tomó una pausa.</h1>
      <p>No encontramos lo que buscabas — pero la experiencia te espera.</p>
      <a class="cta" href="/">Volver al inicio →</a>
    </div>
  </div>
</body>
</html>
